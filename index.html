<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Master - NV3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="card vocabulary-hub">
        <h2>Vocabulary Master</h2>
        
        <!-- Botões de Nível -->
        <div class="vocab-controls" id="vocab-controls">
            <button onclick="renderVocab('A1')">A1</button>
            <button onclick="renderVocab('A2')">A2</button>
            <button onclick="renderVocab('B1')">B1</button>
            <button onclick="renderVocab('B2')">B2</button>
            <button onclick="renderVocab('C1')">C1</button>
        </div>
        
        <!-- Tela 1: Lista de Vocabulário -->
        <div id="vocab-display" class="vocab-grid"></div>
        <div id="vocab-footer" class="vocab-actions" style="display:none; margin-top: 20px;">
            <button class="btn-quiz" onclick="startQuiz()">Iniciar Quiz (+XP)</button>
            <button class="btn-teacher" onclick="window.open('https://wa.me/seu-numero')">Ask Teacher</button>
        </div>

        <!-- Tela 2: O Quiz (Inicia escondido) -->
        <div id="quiz-display" style="display: none;">
            <!-- O JS vai injetar os cards do quiz aqui -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
